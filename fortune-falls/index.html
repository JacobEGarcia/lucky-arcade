<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Lucky Cat: Fortune Falls</title>
<meta property="og:title" content="Lucky Cat: Fortune Falls">
<meta property="og:description" content="Beckon the fortune. Catch it. One minute, one lucky paw.">
<style>
  html,body{margin:0;padding:0;height:100%;background:#1a0f14;overflow:hidden;touch-action:none;
    font-family:"Trebuchet MS",Verdana,sans-serif;-webkit-user-select:none;user-select:none}
  #game{display:block;width:100vw;height:100vh}
  #ui{position:fixed;inset:0;pointer-events:none;color:#ffe9c9}
  .card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
    background:rgba(38,18,26,.92);border:2px solid #e8b84b;border-radius:18px;padding:28px 34px;
    pointer-events:auto;box-shadow:0 12px 60px rgba(0,0,0,.5);max-width:min(86vw,420px)}
  h1{margin:.1em 0 .2em;font-size:clamp(26px,6vw,40px);color:#ffd76e;letter-spacing:.5px}
  .sub{color:#e8b84b;font-size:clamp(13px,3vw,16px);margin-bottom:14px}
  .rule{color:#f5d9b0;font-size:clamp(13px,3vw,15px);line-height:1.5;margin:10px 0}
  button{pointer-events:auto;cursor:pointer;border:0;border-radius:12px;padding:13px 26px;
    font-size:clamp(15px,3.4vw,18px);font-weight:700;background:linear-gradient(#ffd76e,#e8a13b);
    color:#4a2410;box-shadow:0 4px 0 #a8651c,0 8px 18px rgba(0,0,0,.4);transition:transform .08s}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #a8651c}
  #shareBtn{background:linear-gradient(#9be37b,#4fae4a);color:#0f3312;box-shadow:0 4px 0 #2c6e2f,0 8px 18px rgba(0,0,0,.4);margin-left:10px}
  #hud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;
    font-size:clamp(15px,3.6vw,20px);font-weight:700;text-shadow:0 2px 4px #000}
  #combo{color:#ffd76e}
  #mute{position:absolute;bottom:10px;right:12px;font-size:22px;pointer-events:auto;cursor:pointer;opacity:.8}
  .hidden{display:none!important}
  #toast{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);color:#ffd76e;
    font-size:clamp(14px,3.4vw,18px);text-shadow:0 2px 4px #000;opacity:0;transition:opacity .3s}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="hud"><span id="score">0</span><span id="combo"></span><span id="time">60</span></div>
  <div id="startCard" class="card">
    <h1>Lucky Cat<br>Fortune Falls</h1>
    <div class="sub">The paw beckons. The fortune falls. Catch it.</div>
    <div class="rule">Move Lucky with your finger or mouse.<br>
      Coins 1 &middot; Koban 5 &middot; Red envelope 10<br>
      Fishbones break your combo. Combos multiply everything.</div>
    <button id="startBtn">Play (60s)</button>
  </div>
  <div id="overCard" class="card hidden">
    <h1 id="title">Fortune!</h1>
    <div class="sub" id="rank"></div>
    <div class="rule" id="finalScore"></div>
    <div class="rule" id="bestScore"></div>
    <button id="againBtn">Again</button><button id="shareBtn">Share your luck</button>
  </div>
  <div id="toast"></div>
  <div id="mute">🔊</div>
</div>
<script>
"use strict";
const store=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return localStorage;}
catch(e){const m={};return{getItem:k=>(k in m?m[k]:null),setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();
const cv=document.getElementById('game'),cx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';cx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

// ---------- audio: tiny synth, no assets ----------
let AC=null,muted=false;
function beep(f,d=.08,type='sine',g=.12,slide=0){
  if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),AC.currentTime+d);
  v.gain.setValueAtTime(g,AC.currentTime);v.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(v).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
document.getElementById('mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇':'🔊';};

// ---------- state ----------
const S={mode:'start',t:0,left:60,score:0,combo:0,mult:1,best:+(store.getItem('luckyBest')||0),
  catX:.5,catV:0,targetX:.5,items:[],parts:[],pops:[],shake:0,spawn:0,wave:0,caught:0,golds:0};
const TYPES=[
  {k:'coin',  w:68, v:1, r:16, c:'#ffd76e'},
  {k:'koban', w:22, v:5, r:19, c:'#f7b32b'},
  {k:'red',   w:6,  v:10,r:18, c:'#e84545'},
  {k:'bone',  w:18, v:0, r:15, c:'#d8d3c8'}];
function pick(){let t=Math.random()*100,a=0;for(const x of TYPES){a+=x.w;if(t<a)return x;}return TYPES[0];}

function startGame(){S.mode='play';S.t=0;S.left=60;S.score=0;S.combo=0;S.mult=1;S.items=[];
  S.parts=[];S.pops=[];S.shake=0;S.spawn=0;S.caught=0;S.golds=0;
  document.getElementById('startCard').classList.add('hidden');
  document.getElementById('overCard').classList.add('hidden');beep(660,.1,'triangle',.12,220);}
function endGame(){S.mode='over';
  const sc=S.score;let rank;
  if(sc>=400)rank='MOUNTAIN OF FORTUNE';else if(sc>=250)rank='FORTUNE FOUNTAIN';
  else if(sc>=150)rank='GOLDEN PAW';else if(sc>=80)rank='LUCKY STREAK';else rank='POCKET OF PENNIES';
  if(sc>S.best){S.best=sc;store.setItem('luckyBest',sc);}
  document.getElementById('rank').textContent=rank;
  document.getElementById('finalScore').textContent=sc+' fortune beckoned ('+S.caught+' catches)';
  document.getElementById('bestScore').textContent='Best: '+S.best;
  document.getElementById('overCard').classList.remove('hidden');
  beep(392,.18,'triangle',.14,-120);setTimeout(()=>beep(523,.22,'triangle',.14),160);}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('againBtn').onclick=startGame;
document.getElementById('shareBtn').onclick=async()=>{
  const txt='I beckoned '+S.score+' fortune in Lucky Cat: Fortune Falls! Can your paw beat mine? Join the Lucky Cat first-build list: https://jacobegarcia.github.io/luckycat/#wishlist';
  try{if(navigator.share){await navigator.share({title:'Lucky Cat: Fortune Falls',text:txt,url:'https://jacobegarcia.github.io/luckycat/#wishlist'});}
  else{await navigator.clipboard.writeText(txt);toast('Copied! Paste it anywhere.');}}catch(e){}};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity=1;
  setTimeout(()=>t.style.opacity=0,1800);}

// ---------- input ----------
function px(e){return (e.touches?e.touches[0].clientX:e.clientX)/W;}
addEventListener('pointermove',e=>{S.targetX=px(e);});
addEventListener('touchmove',e=>{S.targetX=px(e);e.preventDefault();},{passive:false});
addEventListener('pointerdown',e=>{S.targetX=px(e);});

// ---------- mechanics ----------
function spawnItem(){const ty=pick();
  S.items.push({ty,x:.06+Math.random()*.88,y:-30,vy:0,rot:Math.random()*6.28,vr:(Math.random()-.5)*3,
    wob:Math.random()*6.28});}
function catchIt(it){const v=it.ty.v;
  if(it.ty.k==='bone'){S.combo=0;S.mult=1;S.shake=6;beep(140,.18,'sawtooth',.12,-60);
    pop('COMBO LOST',it.x,it.y,'#d8d3c8');return;}
  S.combo++;S.mult=Math.min(5,1+Math.floor(S.combo/6));S.caught++;
  const pts=v*S.mult;S.score+=pts;
  if(it.ty.k==='koban'){S.shake=3;S.golds++;beep(880,.12,'triangle',.16,330);}
  else if(it.ty.k==='red'){S.shake=4;beep(1046,.14,'triangle',.16,440);}
  else beep(620+Math.min(400,S.combo*12),.07,'sine',.11,80);
  pop('+'+pts,it.x,it.y,it.ty.c);burst(it.x*W,it.y,it.ty.c);
  if(S.mult>1&&S.combo%6===0)pop('COMBO x'+S.mult,.5,H*.3,'#ffd76e',1.4);}
function pop(txt,x,y,c,sc=1){S.pops.push({txt,x:typeof x==='number'&&x<=1?x*W:x,y,c,t:0,sc});}
function burst(x,y,c){for(let i=0;i<14;i++){const a=Math.random()*6.28,s=60+Math.random()*180;
  S.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,t:0,c,r:1.5+Math.random()*2.5});}}

function update(dt){
  if(S.mode!=='play')return;
  S.t+=dt;S.left=Math.max(0,60-S.t);
  // ramp: spawn interval 0.9s -> 0.38s, fall speed 220 -> 420 px/s
  const p=S.t/60,iv=0.9-0.52*p,sp=220+200*p;
  S.spawn-=dt;if(S.spawn<=0){S.spawn=iv;spawnItem();}
  S.catX+=(S.targetX-S.catX)*Math.min(1,dt*14);S.wave+=dt*6;
  const catY=H-90,catchW=64,catchH=54;
  for(let i=S.items.length-1;i>=0;i--){const it=S.items[i];
    it.vy+=dt*140;it.y+=it.vy*dt+sp*dt;it.rot+=it.vr*dt;it.wob+=dt*3;
    const ix=it.x*W+Math.sin(it.wob)*8,iy=it.y;
    const dx=ix-S.catX*W,dy=iy-catY;
    if(Math.abs(dx)<catchW&&Math.abs(dy)<catchH){catchIt(it);S.items.splice(i,1);continue;}
    if(iy>H+40){if(it.ty.k!=='bone'&&S.combo>0){S.combo=0;S.mult=1;}S.items.splice(i,1);}}
  for(let i=S.parts.length-1;i>=0;i--){const q=S.parts[i];q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
    q.vy+=500*dt;if(q.t>.7)S.parts.splice(i,1);}
  for(let i=S.pops.length-1;i>=0;i--){const q=S.pops[i];q.t+=dt;q.y-=40*dt;if(q.t>1.1)S.pops.splice(i,1);}
  S.shake=Math.max(0,S.shake-dt*18);
  document.getElementById('score').textContent=S.score;
  document.getElementById('combo').textContent=S.mult>1?('x'+S.mult+' · '+S.combo):'';
  document.getElementById('time').textContent=Math.ceil(S.left);
  if(S.left<=0)endGame();}

// ---------- drawing ----------
function bg(){const g=cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#241118');g.addColorStop(.6,'#3a1a24');g.addColorStop(1,'#57232c');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.fillStyle='rgba(255,215,110,.06)';
  for(let i=0;i<3;i++){cx.beginPath();cx.arc(W*(.2+.3*i),H*.25,120+i*30,0,6.28);cx.fill();}
  cx.fillStyle='#2b151d';cx.fillRect(0,H-64,W,64);
  cx.fillStyle='rgba(232,184,75,.25)';cx.fillRect(0,H-64,W,3);}
function drawCat(){const x=S.catX*W,y=H-90,s=Math.min(W,H)/420*(S.mode==='play'?1+S.shake*.01:1);
  cx.save();cx.translate(x,y);cx.scale(s,s);
  const sw=Math.sin(S.wave)*.5; // paw wave
  cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();cx.ellipse(0,62,60,12,0,0,6.28);cx.fill();
  // tail
  cx.strokeStyle='#f7f0e3';cx.lineWidth=13;cx.lineCap='round';
  cx.beginPath();cx.moveTo(-44,38);cx.quadraticCurveTo(-78,20,-66,-16-Math.sin(S.wave*.7)*8);cx.stroke();
  // body
  cx.fillStyle='#f7f0e3';cx.beginPath();cx.ellipse(0,22,52,44,0,0,6.28);cx.fill();
  // head
  cx.beginPath();cx.arc(0,-34,38,0,6.28);cx.fill();
  // ears
  cx.beginPath();cx.moveTo(-30,-58);cx.lineTo(-40,-88);cx.lineTo(-12,-70);cx.closePath();cx.fill();
  cx.beginPath();cx.moveTo(30,-58);cx.lineTo(40,-88);cx.lineTo(12,-70);cx.closePath();cx.fill();
  cx.fillStyle='#e8a0a0';
  cx.beginPath();cx.moveTo(-29,-63);cx.lineTo(-35,-80);cx.lineTo(-17,-69);cx.closePath();cx.fill();
  cx.beginPath();cx.moveTo(29,-63);cx.lineTo(35,-80);cx.lineTo(17,-69);cx.closePath();cx.fill();
  // collar + bell
  cx.fillStyle='#d43a3a';cx.fillRect(-34,-8,68,12);
  cx.fillStyle='#ffd76e';cx.beginPath();cx.arc(0,8,9,0,6.28);cx.fill();
  cx.fillStyle='#a8651c';cx.fillRect(-5,5,10,2.4);
  // eyes (happy arcs)
  cx.strokeStyle='#3a2020';cx.lineWidth=3.4;
  cx.beginPath();cx.arc(-14,-38,7,3.4,6.0);cx.stroke();
  cx.beginPath();cx.arc(14,-38,7,3.4,6.0);cx.stroke();
  // nose + mouth
  cx.fillStyle='#e8a0a0';cx.beginPath();cx.arc(0,-28,3,0,6.28);cx.fill();
  cx.strokeStyle='#c97070';cx.lineWidth=2;
  cx.beginPath();cx.arc(-4,-23,4,0,3.14);cx.stroke();
  cx.beginPath();cx.arc(4,-23,4,0,3.14);cx.stroke();
  // beckoning paw (raised right)
  cx.save();cx.translate(34,-6);cx.rotate(-.5-sw*.55);
  cx.fillStyle='#f7f0e3';cx.beginPath();cx.ellipse(0,-26,13,24,0,0,6.28);cx.fill();
  cx.fillStyle='#e8a0a0';cx.beginPath();cx.ellipse(0,-34,7,9,0,0,6.28);cx.fill();
  cx.restore();
  // left paw down
  cx.fillStyle='#f7f0e3';cx.beginPath();cx.ellipse(-26,52,14,10,0,0,6.28);cx.fill();
  cx.beginPath();cx.ellipse(26,52,14,10,0,0,6.28);cx.fill();
  cx.restore();}
function drawItem(it){const x=it.x*W+Math.sin(it.wob)*8,y=it.y;
  cx.save();cx.translate(x,y);cx.rotate(it.rot);
  if(it.ty.k==='coin'){cx.fillStyle='#ffd76e';cx.beginPath();cx.arc(0,0,14,0,6.28);cx.fill();
    cx.strokeStyle='#c98f1f';cx.lineWidth=2.6;cx.beginPath();cx.arc(0,0,10,0,6.28);cx.stroke();
    cx.fillStyle='#c98f1f';cx.font='bold 12px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('¥',0,1);}
  else if(it.ty.k==='koban'){cx.fillStyle='#f7b32b';cx.beginPath();cx.ellipse(0,0,13,18,0,0,6.28);cx.fill();
    cx.strokeStyle='#b87b14';cx.lineWidth=2.4;cx.beginPath();cx.ellipse(0,0,9,13,0,0,6.28);cx.stroke();}
  else if(it.ty.k==='red'){cx.fillStyle='#e84545';cx.beginPath();cx.roundRect(-11,-15,22,30,4);cx.fill();
    cx.fillStyle='#ffd76e';cx.fillRect(-11,-15,22,7);cx.font='bold 13px sans-serif';
    cx.textAlign='center';cx.textBaseline='middle';cx.fillText('福',0,5);}
  else{cx.strokeStyle='#d8d3c8';cx.lineWidth=5;cx.lineCap='round';
    cx.beginPath();cx.moveTo(-13,0);cx.lineTo(13,0);cx.stroke();
    cx.beginPath();cx.moveTo(-8,-6);cx.lineTo(-8,6);cx.moveTo(0,-6);cx.lineTo(0,6);cx.moveTo(8,-6);cx.lineTo(8,6);cx.stroke();}
  cx.restore();}
function draw(){
  bg();cx.save();
  if(S.shake>0)cx.translate((Math.random()-.5)*S.shake,(Math.random()-.5)*S.shake);
  for(const it of S.items)drawItem(it);
  drawCat();
  for(const q of S.parts){cx.globalAlpha=1-q.t/.7;cx.fillStyle=q.c;
    cx.beginPath();cx.arc(q.x,q.y,q.r,0,6.28);cx.fill();}
  cx.globalAlpha=1;
  for(const q of S.pops){cx.globalAlpha=1-q.t/1.1;cx.fillStyle=q.c;
    cx.font='bold '+Math.round(20*q.sc)+'px Trebuchet MS';cx.textAlign='center';
    cx.strokeStyle='rgba(0,0,0,.6)';cx.lineWidth=3;cx.strokeText(q.txt,q.x,q.y);cx.fillText(q.txt,q.x,q.y);}
  cx.globalAlpha=1;cx.restore();}

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange',()=>{if(document.hidden)last=performance.now();});
</script>
</body>
</html>
